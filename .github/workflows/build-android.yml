name: Build StandUp Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Target Output (apk, bundle, or both)'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - bundle
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android (${{ github.event.inputs.build_type || 'apk' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔑 Make gradlew executable
        run: chmod +x android/gradlew

      - name: 🔨 Build Android Release APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 📦 Build Android Release App Bundle (AAB)
        if: ${{ github.event.inputs.build_type == 'bundle' || github.event.inputs.build_type == 'both' }}
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: 📤 Upload Installable APK Artifact
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: StandUp-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: 📤 Upload Google Play Bundle Artifact (AAB)
        if: ${{ github.event.inputs.build_type == 'bundle' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: StandUp-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
